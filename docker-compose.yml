services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pkp
      POSTGRES_PASSWORD: pkp
      POSTGRES_DB: pkp_bet
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pkp:pkp@db:5432/pkp_bet
      PLK_API_BASE_URL: https://pdp-api.plk-sa.pl
      PLK_API_KEY: ${PLK_API_KEY}
    depends_on:
      - db
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  pgdata:
